<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QLM | Pipeline</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--blue:#0099d8;--blue-md:#0077a8;--blue-dk:#005a7e;--blue-lt:#e0f4fc;--mid:#b8dff0;--navy:#003a52;--gray:#f4f7fb;--text:#2a4a5a;}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--gray);min-height:100vh;color:var(--text);}
header{background:var(--navy);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:60px;box-shadow:0 2px 12px rgba(0,0,0,.3);gap:12px;}
.logo{display:flex;align-items:center;gap:9px;}
.logo-badge{background:var(--blue);color:#fff;font-weight:700;font-size:.85rem;letter-spacing:2px;padding:5px 11px;border-radius:4px;}
.logo-text{color:var(--mid);font-size:.78rem;letter-spacing:1px;white-space:nowrap;}
.tool-nav{display:flex;align-items:center;gap:6px;}
@media(max-width:900px){.logo-text{display:none;}}

.main{max-width:1500px;margin:0 auto;padding:20px 18px 70px;}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px;}
.head h1{font-size:1.3rem;font-weight:700;color:var(--navy);display:flex;align-items:center;gap:9px;}
.src{font-size:.72rem;color:#64748b;margin-bottom:16px;}

.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap;}
.tab{padding:9px 20px;border-radius:9px;font-size:.85rem;font-weight:600;border:1.5px solid var(--mid);background:#fff;color:#64748b;cursor:pointer;font-family:inherit;}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff;}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.kpi{background:#fff;border:1px solid var(--mid);border-radius:11px;border-top:3px solid var(--blue);padding:14px 15px;}
.kpi .n{font-size:1.5rem;font-weight:700;color:var(--navy);line-height:1;}
.kpi .l{font-size:.63rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#64748b;margin-top:4px;}
.kpi .s{font-size:.68rem;color:#94a3b8;margin-top:2px;}

.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
.search{flex:1;min-width:220px;border:1px solid var(--mid);border-radius:9px;padding:9px 13px;font-size:.86rem;font-family:inherit;outline:none;background:#fff;}
.search:focus{border-color:var(--blue);}
.btn{background:#fff;border:1.5px solid var(--mid);color:var(--blue-md);border-radius:8px;padding:8px 14px;font-size:.74rem;font-weight:600;cursor:pointer;font-family:inherit;}
.btn:hover{border-color:var(--blue);background:var(--blue-lt);}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff;}

.board{display:grid;gap:11px;overflow-x:auto;padding-bottom:8px;}
.col{background:#eef4f9;border-radius:12px;padding:11px;min-width:0;}
.col-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;padding:0 3px;}
.col-t{font-size:.68rem;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--navy);}
.col-n{font-size:.7rem;font-weight:700;color:#fff;background:var(--blue-md);border-radius:20px;padding:2px 8px;}
.card{background:#fff;border:1px solid #dbe7f0;border-radius:10px;padding:11px 12px;margin-bottom:8px;cursor:pointer;transition:box-shadow .15s,transform .1s;}
.card:hover{box-shadow:0 5px 16px rgba(0,153,216,.15);transform:translateY(-1px);}
.card-n{font-size:.86rem;font-weight:700;color:var(--navy);line-height:1.3;}
.card-s{font-size:.72rem;color:#64748b;margin-top:2px;}
.card-m{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px;}
.pill{font-size:.62rem;font-weight:600;padding:2px 8px;border-radius:20px;background:#f1f5f9;border:1px solid #e2e8f0;color:#64748b;}
.pill.g{background:#f0fdf4;border-color:#bbf7d0;color:#15803d;}
.pill.a{background:#fefce8;border-color:#fde68a;color:#a16207;}
.pill.r{background:#fef2f2;border-color:#fecaca;color:#b91c1c;}
.pill.b{background:var(--blue-lt);border-color:var(--mid);color:var(--blue-md);}
.card-f{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-top:7px;border-top:1px solid #f1f5f9;font-size:.68rem;color:#94a3b8;}
.stale{color:#b91c1c;font-weight:600;}
.col-empty{font-size:.74rem;color:#94a3b8;text-align:center;padding:14px 6px;}

.modal{position:fixed;inset:0;background:rgba(0,58,82,.55);z-index:999;display:flex;align-items:center;justify-content:center;padding:16px;}
.modal.hidden{display:none!important;}
.mbox{background:#fff;border-radius:14px;max-width:620px;width:100%;max-height:92vh;overflow-y:auto;box-shadow:0 24px 70px rgba(0,0,0,.3);}
.mh{background:var(--navy);padding:20px 24px;border-radius:14px 14px 0 0;position:relative;}
.mh h2{color:#fff;font-size:1.15rem;font-weight:700;}
.mh .sub{color:var(--mid);font-size:.82rem;margin-top:3px;}
.mclose{position:absolute;top:15px;right:17px;background:rgba(255,255,255,.12);border:none;color:#fff;width:27px;height:27px;border-radius:50%;cursor:pointer;font-size:1rem;line-height:1;}
.mb{padding:20px 24px;}
.msec{font-size:.63rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue-md);margin:18px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--blue-lt);}
.msec:first-child{margin-top:0;}
.mrow{display:flex;gap:12px;padding:6px 0;font-size:.86rem;}
.mrow .k{color:#64748b;min-width:120px;}
.mrow .v{color:var(--text);font-weight:500;}
.fl{margin-bottom:11px;}
.fl label{display:block;font-size:.62rem;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:#64748b;margin-bottom:4px;}
.fl input,.fl select,.fl textarea{width:100%;border:1px solid var(--mid);border-radius:8px;padding:9px 12px;font-size:.86rem;font-family:inherit;outline:none;}
.fl textarea{min-height:78px;resize:vertical;}
.macts{display:flex;gap:8px;flex-wrap:wrap;padding:14px 24px 20px;border-top:1px solid #f1f5f9;}
.mbtn{padding:9px 15px;border-radius:8px;font-size:.79rem;font-weight:600;cursor:pointer;font-family:inherit;border:1.5px solid var(--mid);background:#fff;color:var(--blue-md);text-decoration:none;display:inline-flex;align-items:center;gap:5px;}
.mbtn.primary{background:var(--navy);color:#fff;border-color:var(--navy);}
footer{background:var(--navy);color:rgba(255,255,255,.35);text-align:center;padding:12px;font-size:.7rem;}
.shim{background:linear-gradient(90deg,#f1f5f9 25%,#e8eef4 50%,#f1f5f9 75%);background-size:200% 100%;animation:sh 1.4s infinite;height:64px;border-radius:10px;margin-bottom:8px;}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="logo-badge">QLM</div><div class="logo-text">Quality Labor Management</div></div>
  <div class="tool-nav"><span id="qlm-auth" style="display:inline-flex;align-items:center;margin-right:6px;"></span></div>
</header>

<div class="main">
  <div class="head">
    <h1>&#128202; Pipeline</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn dark" onclick="quickNewJob()">+ New Job Order</button>
      <button class="btn" onclick="exportPipeline()">&#8595; Export CSV</button>
      <button class="btn dark" onclick="loadAll()">&#8635; Refresh</button>
    </div>
  </div>
  <div class="src" id="src-note"></div>

  <div class="tabs">
    <button class="tab on" id="tab-today"  onclick="setTab('today')">&#9203; Today</button>
    <button class="tab" id="tab-jobs"      onclick="setTab('jobs')">&#128188; Job Orders</button>
    <button class="tab" id="tab-cand"      onclick="setTab('candidates')">&#128101; Candidates</button>
    <button class="tab" id="tab-companies" onclick="setTab('companies')">&#127970; Companies</button>
    <button class="tab" id="tab-client"    onclick="setTab('clients')">&#127919; Leads</button>
    <button class="tab" id="tab-place"     onclick="setTab('placements')">&#9989; Placements</button>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <input class="search" id="search" placeholder="Search by name, company, trade, city..." oninput="render()">
    <select class="btn" id="owner-filter" onchange="render()" style="padding:8px 12px;">
      <option value="all">All owners</option>
    </select>
    <button class="btn" id="stale-btn" onclick="toggleStale()">Show stale only</button>
  </div>

  <div class="board" id="board"></div>
</div>

<div class="modal hidden" id="modal">
  <div class="mbox">
    <div class="mh">
      <button class="mclose" onclick="closeModal()">&times;</button>
      <h2 id="m-title"></h2>
      <div class="sub" id="m-sub"></div>
    </div>
    <div class="mb" id="m-body"></div>
    <div class="macts" id="m-acts"></div>
  </div>
</div>

<footer>&copy; 2025 Quality Labor Management, LLC &middot; Pipeline &middot; Internal &middot; myqlm.com</footer>

<script>window.QLM_REQUIRE_AUTH = true; window.QLM_REQUIRE_ADMIN = true;</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/qlm-data.js"></script>
<script>
var TAB = 'today', STALE_ONLY = false;
var CANDIDATES = [], LEADS = [], ASSESSMENTS = [], REPORTS = [], TEAM = [];

var CAND_STAGES = [
  { id:'applied',    label:'Applied',       hint:'Came in from the application' },
  { id:'screening',  label:'Screening',     hint:'Recruiter reviewing' },
  { id:'assessed',   label:'Assessed',      hint:'Skills test complete' },
  { id:'card_ready', label:'Card Ready',    hint:'Talent card built' },
  { id:'submitted',  label:'Submitted',     hint:'Sent to a client' },
  { id:'placed',     label:'Placed',        hint:'Working' }
];
var CLIENT_STAGES = [
  { id:'new',       label:'New' },
  { id:'contacted', label:'Contacted' },
  { id:'qualified', label:'Qualified' },
  { id:'proposal',  label:'Proposal Out' },
  { id:'won',       label:'Won' },
  { id:'lost',      label:'Lost' }
];

var TRADE_LABEL = {
  electrician:'Electrician', plumber:'Plumber / Pipefitter', welder:'Welder', hvac:'HVAC Technician',
  carpenter:'Carpenter / Framing', concrete:'Concrete / Formwork', operator:'Heavy Equipment Operator',
  foreman:'Foreman / Superintendent', solar:'Solar / PV Installer', pipefitter:'Pipefitter (Industrial)',
  ironworker:'Ironworker', painter:'Painter / Coatings', instrumentation:'Instrumentation Technician',
  general_labor:'General Labor', skilled_labor:'Skilled Labor',
  display_tech:'Display / Electronics Technician', qlm_orientation:'QLM Orientation'
};
function prettyTrade(t){
  if(!t) return '';
  if(TRADE_LABEL[t]) return TRADE_LABEL[t];
  var k = String(t).toLowerCase().replace(/\s+/g,'_');
  return TRADE_LABEL[k] || String(t).replace(/_/g,' ').replace(/\b\w/g,function(m){return m.toUpperCase();});
}
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function daysSince(d){ if(!d) return null; return Math.floor((Date.now() - new Date(d).getTime())/86400000); }
function money(v){ return v ? '$' + Math.round(v).toLocaleString('en-US') : ''; }

// ═══════════════════════════════════════════════════════════════
//  ATS CORE — job orders, submissions, companies, placements,
//  activity timeline and task list
// ═══════════════════════════════════════════════════════════════
var COMPANIES = [], CONTACTS = [], JOBS = [], SUBS = [], PLACEMENTS = [], ACTS = [];

var JOB_STAGES = [
  { id:'open',    label:'Open',     hint:'Needs candidates' },
  { id:'filling', label:'Filling',  hint:'Submissions out' },
  { id:'filled',  label:'Filled',   hint:'All openings covered' },
  { id:'on_hold', label:'On Hold',  hint:'Client paused it' },
  { id:'closed',  label:'Closed',   hint:'Complete' },
  { id:'lost',    label:'Lost',     hint:'Went elsewhere' }
];

var SUB_STAGES = ['shortlist','submitted','client_review','interview','offer','placed','rejected','withdrawn'];
var SUB_LABEL = {
  shortlist:'Shortlisted', submitted:'Submitted', client_review:'Client Review',
  interview:'Interview', offer:'Offer', placed:'Placed', rejected:'Rejected', withdrawn:'Withdrawn'
};
var SUB_COLOR = {
  shortlist:'', submitted:'b', client_review:'b', interview:'a',
  offer:'a', placed:'g', rejected:'r', withdrawn:''
};

async function loadAts(){
  if(!window.QLM || !QLM.client()) return;
  var q = QLM.client();
  var res = await Promise.all([
    q.from('companies').select('*').order('name').then(r=>r.data||[]),
    q.from('contacts').select('*').then(r=>r.data||[]),
    q.from('job_orders').select('*').order('created_at',{ascending:false}).then(r=>r.data||[]),
    q.from('submissions').select('*').order('created_at',{ascending:false}).then(r=>r.data||[]),
    q.from('placements').select('*').order('start_date',{ascending:false}).then(r=>r.data||[]),
    q.from('crm_activity').select('*').order('created_at',{ascending:false}).limit(400).then(r=>r.data||[])
  ]);
  COMPANIES = res[0]; CONTACTS = res[1]; JOBS = res[2]; SUBS = res[3]; PLACEMENTS = res[4]; ACTS = res[5];
}

function companyName(id){ var c = COMPANIES.find(x=>x.id===id); return c ? c.name : ''; }
function candName(id){ var c = CANDIDATES.find(x=>x.id===id); return c ? c.full_name : ''; }
function jobTitle(id){ var j = JOBS.find(x=>x.id===id); return j ? j.title : ''; }
function subsFor(jobId){ return SUBS.filter(s=>s.job_order_id===jobId); }
function jobsFor(companyId){ return JOBS.filter(j=>j.company_id===companyId); }
function actsFor(type, id){ return ACTS.filter(a=>a.entity_type===type && a.entity_id===id); }
function openTasks(){
  return ACTS.filter(a=>a.type==='task' && !a.done).sort(function(a,b){
    return new Date(a.due_date||'2099-01-01') - new Date(b.due_date||'2099-01-01');
  });
}

// ═══════════ JOB ORDERS BOARD ═══════════
function renderJobs(q, owner){
  var rows = JOBS.filter(function(j){
    if(!passOwner(j, owner)) return false;
    if(STALE_ONLY && (daysSince(j.stage_changed_at||j.created_at)||0) < 14) return false;
    if(!q) return true;
    return [j.title, companyName(j.company_id), j.city, prettyTrade(j.trade)].join(' ').toLowerCase().indexOf(q) > -1;
  });

  var open = rows.filter(j=>['open','filling'].indexOf(j.status)>-1);
  var openings = open.reduce(function(s,j){
    var placed = subsFor(j.id).filter(x=>x.status==='placed').length;
    return s + Math.max(0, (j.openings||1) - placed);
  }, 0);
  var weeklyValue = open.reduce(function(s,j){
    var placed = subsFor(j.id).filter(x=>x.status==='placed').length;
    var need = Math.max(0,(j.openings||1)-placed);
    return s + need * (j.bill_rate||0) * 40;
  },0);

  document.getElementById('kpis').innerHTML =
    kpi(rows.length,'Job orders') +
    kpi(open.length,'Open','Actively working') +
    kpi(openings,'Seats to fill') +
    kpi(rows.filter(j=>j.priority==='critical'||j.priority==='high').length,'High priority') +
    kpi(weeklyValue?money(weeklyValue):'\u2014','Weekly value','If all seats filled') +
    kpi(SUBS.filter(s=>['submitted','client_review','interview','offer'].indexOf(s.status)>-1).length,'Active submissions');

  var board = document.getElementById('board');
  board.style.gridTemplateColumns = 'repeat(' + JOB_STAGES.length + ', minmax(215px,1fr))';
  board.innerHTML = JOB_STAGES.map(function(st){
    var items = rows.filter(j=>(j.status||'open')===st.id);
    return '<div class="col"><div class="col-h"><span class="col-t">'+st.label+'</span>' +
      '<span class="col-n">'+items.length+'</span></div>' +
      (items.length ? items.map(jobCard).join('') : '<div class="col-empty">'+st.hint+'</div>') + '</div>';
  }).join('');
}

function jobCard(j){
  var i = JOBS.indexOf(j);
  var subs = subsFor(j.id);
  var placed = subs.filter(s=>s.status==='placed').length;
  var active = subs.filter(s=>['submitted','client_review','interview','offer'].indexOf(s.status)>-1).length;
  var days = daysSince(j.stage_changed_at||j.created_at);
  var stale = days>=14 && ['open','filling'].indexOf(j.status)>-1;
  var pri = j.priority==='critical' ? '<span class="pill r">Critical</span>'
          : j.priority==='high' ? '<span class="pill a">High</span>' : '';
  return '<div class="card" onclick="openJob('+i+')">' +
    '<div class="card-n">'+esc(j.title)+'</div>' +
    '<div class="card-s">'+esc(companyName(j.company_id))+(j.city?' \u00b7 '+esc(j.city):'')+'</div>' +
    '<div class="card-m">' + pri +
      '<span class="pill b">'+placed+'/'+(j.openings||1)+' filled</span>' +
      (active?'<span class="pill a">'+active+' out</span>':'') +
      (j.bill_rate?'<span class="pill">$'+j.bill_rate+'/hr</span>':'') +
    '</div>' +
    '<div class="card-f"><span>'+(ownerName(j.owner_id)||'Unassigned')+'</span>' +
    '<span class="'+(stale?'stale':'')+'">'+(days!=null?days+'d':'')+'</span></div></div>';
}

// ═══════════ JOB ORDER DETAIL ═══════════
function openJob(i){
  var j = JOBS[i];
  if(!j) return;
  var subs = subsFor(j.id);
  var placed = subs.filter(s=>s.status==='placed').length;

  document.getElementById('m-title').textContent = j.title;
  document.getElementById('m-sub').textContent =
    [companyName(j.company_id), j.city, prettyTrade(j.trade)].filter(Boolean).join(' \u00b7 ');

  document.getElementById('m-body').innerHTML =
    '<div class="msec">Requisition</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
      '<div class="fl"><label>Status</label><select id="j-status">' +
        JOB_STAGES.map(s=>'<option value="'+s.id+'"'+(j.status===s.id?' selected':'')+'>'+s.label+'</option>').join('') +
      '</select></div>' +
      '<div class="fl"><label>Priority</label><select id="j-pri">' +
        ['low','normal','high','critical'].map(p=>'<option value="'+p+'"'+(j.priority===p?' selected':'')+'>'+p.charAt(0).toUpperCase()+p.slice(1)+'</option>').join('') +
      '</select></div>' +
      '<div class="fl"><label>Openings</label><input type="number" id="j-openings" value="'+(j.openings||1)+'"></div>' +
      '<div class="fl"><label>Owner</label><select id="j-owner"><option value="">Unassigned</option>' +
        TEAM.map(t=>'<option value="'+t.id+'"'+(j.owner_id===t.id?' selected':'')+'>'+esc(t.name)+'</option>').join('') +
      '</select></div>' +
      '<div class="fl"><label>Pay rate</label><input type="number" id="j-pay" value="'+(j.pay_rate||'')+'"></div>' +
      '<div class="fl"><label>Bill rate</label><input type="number" id="j-bill" value="'+(j.bill_rate||'')+'"></div>' +
      '<div class="fl"><label>Start date</label><input type="date" id="j-start" value="'+(j.start_date||'')+'"></div>' +
      '<div class="fl"><label>Duration (weeks)</label><input type="number" id="j-weeks" value="'+(j.duration_weeks||'')+'"></div>' +
      '<div class="fl"><label>Shift</label><input id="j-shift" value="'+esc(j.shift||'')+'" placeholder="Days, 6-4:30"></div>' +
      '<div class="fl"><label>OT expected</label><input id="j-ot" value="'+esc(j.ot_expected||'')+'" placeholder="10 hrs/wk"></div>' +
    '</div>' +
    '<div class="fl"><label>Certifications required</label><input id="j-certs" value="'+esc(j.certs_required||'')+'" placeholder="OSHA 30, TWIC"></div>' +
    '<div class="fl"><label>Scope / notes</label><textarea id="j-desc">'+esc(j.description||'')+'</textarea></div>' +

    '<div class="msec">Submissions (' + placed + ' of ' + (j.openings||1) + ' placed)</div>' +
    (subs.length ? subs.map(function(s){
      var si = SUBS.indexOf(s);
      return '<div style="display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid #f1f5f9;">' +
        '<div style="flex:1;min-width:0;">' +
          '<div style="font-size:.86rem;font-weight:600;color:#003a52;">'+esc(candName(s.candidate_id)||'Candidate')+'</div>' +
          '<div style="font-size:.72rem;color:#94a3b8;">'+(s.submitted_at?new Date(s.submitted_at).toLocaleDateString():'')+
            (s.bill_rate?' \u00b7 $'+s.bill_rate+'/hr':'')+'</div>' +
        '</div>' +
        '<select onchange="moveSubmission('+si+',this.value)" style="border:1px solid #b8dff0;border-radius:6px;padding:4px 8px;font-size:.75rem;font-family:inherit;">' +
          SUB_STAGES.map(x=>'<option value="'+x+'"'+(s.status===x?' selected':'')+'>'+SUB_LABEL[x]+'</option>').join('') +
        '</select></div>';
    }).join('') : '<div style="font-size:.84rem;color:#94a3b8;padding:6px 0;">No one submitted yet.</div>') +

    '<div class="fl" style="margin-top:11px;"><label>Add candidate to this job</label>' +
      '<select id="j-addcand"><option value="">Select a candidate...</option>' +
        matchCandidates(j).map(function(c){
          var a = assessmentFor(c);
          return '<option value="'+c.id+'">'+esc(c.full_name)+' \u2014 '+esc(prettyTrade(c.trade))+
                 (a&&a.score!=null?' ('+a.score+')':'')+'</option>';
        }).join('') +
      '</select></div>' +
    '<button class="mbtn" onclick="addSubmission(\'' + j.id + '\')" style="margin-bottom:6px;">+ Submit candidate</button>' +

    activityBlock('job_order', j.id);

  document.getElementById('m-acts').innerHTML =
    '<button class="mbtn primary" onclick="saveJob('+i+')">Save</button>' +
    '<button class="mbtn" onclick="closeModal()">Close</button>';
  document.getElementById('modal').classList.remove('hidden');
}

// Candidates that plausibly fit, best first
function matchCandidates(j){
  var trade = (j.trade||'').toLowerCase();
  var city = (j.city||'').toLowerCase().split(',')[0];
  var already = subsFor(j.id).map(s=>s.candidate_id);
  return CANDIDATES.filter(c=>already.indexOf(c.id)===-1 && c.stage!=='placed')
    .map(function(c){
      var score = 0;
      var ct = ((c.trade||'') + ' ' + (c.title||'')).toLowerCase();
      if(trade && ct.indexOf(trade.split(' ')[0]) > -1) score += 50;
      if(city && (c.city||'').toLowerCase().indexOf(city) > -1) score += 20;
      var a = assessmentFor(c);
      if(a && a.score != null) score += Math.round(a.score/5);
      if((c.availability||'').toLowerCase().indexOf('immediate') > -1) score += 15;
      return { c:c, score:score };
    })
    .sort((x,y)=>y.score-x.score)
    .slice(0,40)
    .map(x=>x.c);
}

async function completeTask(actId){
  var r = await QLM.client().from('crm_activity').update({ done:true, done_at:new Date().toISOString() }).eq('id', actId);
  if(!r.error){
    var a = ACTS.find(x=>x.id===actId);
    if(a){ a.done = true; }
    render();
    var m = document.getElementById('modal');
    if(!m.classList.contains('hidden') && window._openEntity) refreshOpenModal(window._openEntity.type, window._openEntity.id);
  }
}

function refreshOpenModal(type, id){
  window._openEntity = { type:type, id:id };
  if(type==='job_order')      openJob(JOBS.findIndex(x=>x.id===id));
  else if(type==='company')   openCompany(COMPANIES.findIndex(x=>x.id===id));
  else if(type==='placement') openPlacement(PLACEMENTS.findIndex(x=>x.id===id));
  else if(type==='candidate') openCandidate(CANDIDATES.findIndex(x=>x.id===id));
}

function renderToday(){
  var tasks = openTasks();
  var today = new Date().toISOString().split('T')[0];
  var overdue = tasks.filter(t=>t.due_date && t.due_date < today);
  var dueToday = tasks.filter(t=>t.due_date === today);
  var upcoming = tasks.filter(t=>!t.due_date || t.due_date > today);

  var newApps = CANDIDATES.filter(c=>c.stage==='applied').length;
  var openSeats = JOBS.filter(j=>['open','filling'].indexOf(j.status)>-1)
    .reduce((s,j)=>s + Math.max(0,(j.openings||1) - subsFor(j.id).filter(x=>x.status==='placed').length), 0);
  var awaiting = SUBS.filter(s=>['submitted','client_review','interview','offer'].indexOf(s.status)>-1).length;

  document.getElementById('kpis').innerHTML =
    kpi(overdue.length,'Overdue', overdue.length?'Needs attention':'') +
    kpi(dueToday.length,'Due today') +
    kpi(newApps,'New applications','Awaiting screening') +
    kpi(openSeats,'Seats to fill') +
    kpi(awaiting,'Submissions pending','With clients') +
    kpi(PLACEMENTS.filter(p=>p.status==='active').length,'Working now');

  function taskRow(t){
    var link = '';
    if(t.entity_type==='job_order'){ var ji=JOBS.findIndex(x=>x.id===t.entity_id); if(ji>-1) link='openJob('+ji+')'; }
    if(t.entity_type==='company'){ var ci=COMPANIES.findIndex(x=>x.id===t.entity_id); if(ci>-1) link='openCompany('+ci+')'; }
    if(t.entity_type==='candidate'){ var ai=CANDIDATES.findIndex(x=>x.id===t.entity_id); if(ai>-1) link='openCandidate('+ai+')'; }
    var label = t.entity_type==='job_order' ? jobTitle(t.entity_id)
              : t.entity_type==='company' ? companyName(t.entity_id)
              : t.entity_type==='candidate' ? candName(t.entity_id) : '';
    return '<div class="card" ' + (link?'onclick="'+link+'"':'') + '>' +
      '<div class="card-n">'+esc(t.body||'')+'</div>' +
      '<div class="card-s">'+esc(label)+'</div>' +
      '<div class="card-f"><span>'+(ownerName(t.owner_id)||'')+'</span>' +
      '<span>'+(t.due_date||'no date')+'</span></div></div>';
  }

  var board = document.getElementById('board');
  board.style.gridTemplateColumns = 'repeat(auto-fit,minmax(260px,1fr))';
  board.innerHTML =
    '<div class="col"><div class="col-h"><span class="col-t">Overdue</span><span class="col-n">'+overdue.length+'</span></div>' +
      (overdue.length?overdue.map(taskRow).join(''):'<div class="col-empty">Nothing overdue</div>')+'</div>' +
    '<div class="col"><div class="col-h"><span class="col-t">Due today</span><span class="col-n">'+dueToday.length+'</span></div>' +
      (dueToday.length?dueToday.map(taskRow).join(''):'<div class="col-empty">Clear</div>')+'</div>' +
    '<div class="col"><div class="col-h"><span class="col-t">Upcoming</span><span class="col-n">'+upcoming.length+'</span></div>' +
      (upcoming.length?upcoming.slice(0,15).map(taskRow).join(''):'<div class="col-empty">Nothing scheduled</div>')+'</div>' +
    '<div class="col"><div class="col-h"><span class="col-t">New applications</span><span class="col-n">'+newApps+'</span></div>' +
      (newApps?CANDIDATES.filter(c=>c.stage==='applied').slice(0,15).map(candCard).join(''):'<div class="col-empty">None waiting</div>')+'</div>';
}

// ═══════════ LOAD ═══════════
async function loadAll(){
  document.getElementById('board').innerHTML = '<div>' + Array(4).fill('<div class="shim"></div>').join('') + '</div>';
  if(!window.QLM || !QLM.client()) return;
  try{
    var res = await Promise.all([
      QLM.list('candidates'), QLM.list('leads'), QLM.list('assessments'),
      QLM.list('market_reports', null, {limit:60}),
      QLM.client().from('profiles').select('id, full_name, email').then(function(r){ return r.data || []; })
    ]);
    CANDIDATES = res[0] || []; LEADS = res[1] || []; ASSESSMENTS = res[2] || [];
    REPORTS = res[3] || [];
    TEAM = (res[4] || []).map(function(p){
      return { id:p.id, name:(p.full_name && p.full_name.indexOf('@') === -1) ? p.full_name : p.email };
    });
    var sel = document.getElementById('owner-filter');
    sel.innerHTML = '<option value="all">All owners</option>' +
      TEAM.map(function(t){ return '<option value="'+t.id+'">'+esc(t.name)+'</option>'; }).join('') +
      '<option value="none">Unassigned</option>';
    await loadAts();
    document.getElementById('src-note').textContent =
      '\u2601 ' + CANDIDATES.length + ' candidates \u00b7 ' + JOBS.length + ' job orders \u00b7 ' +
      COMPANIES.length + ' companies \u00b7 ' + PLACEMENTS.filter(function(p){return p.status==='active';}).length +
      ' working \u00b7 live from cloud';
    render();
  }catch(e){
    document.getElementById('board').innerHTML = '<p style="color:#b91c1c;">Could not load: ' + esc(e.message) + '</p>';
  }
}

function ownerName(id){ var t = TEAM.find(function(x){ return x.id === id; }); return t ? t.name : null; }
function assessmentFor(c){
  var nm = (c.full_name||'').trim().toLowerCase();
  if(!nm) return null;
  return ASSESSMENTS.find(function(a){ return (a.candidate_name||'').trim().toLowerCase() === nm; }) || null;
}
function reportsFor(company){
  var q = (company||'').trim().toLowerCase();
  if(!q) return [];
  return REPORTS.filter(function(r){
    return (r.report && r.report._company || '').toLowerCase().indexOf(q) > -1;
  });
}

function setTab(t){
  TAB = t;
  var map = { today:'tab-today', jobs:'tab-jobs', candidates:'tab-cand',
              companies:'tab-companies', clients:'tab-client', placements:'tab-place' };
  Object.keys(map).forEach(function(k){
    var el = document.getElementById(map[k]);
    if(el) el.className = 'tab' + (k === t ? ' on' : '');
  });
  render();
}
function toggleStale(){
  STALE_ONLY = !STALE_ONLY;
  document.getElementById('stale-btn').textContent = STALE_ONLY ? 'Showing stale only' : 'Show stale only';
  document.getElementById('stale-btn').style.background = STALE_ONLY ? '#fefce8' : '#fff';
  render();
}

// ═══════════ RENDER ═══════════
function render(){
  var q = (document.getElementById('search').value||'').toLowerCase().trim();
  var owner = document.getElementById('owner-filter').value;
  if(TAB === 'today')           renderToday();
  else if(TAB === 'jobs')       renderJobs(q, owner);
  else if(TAB === 'candidates') renderCandidates(q, owner);
  else if(TAB === 'companies')  renderCompanies(q, owner);
  else if(TAB === 'placements') renderPlacements(q, owner);
  else                          renderClients(q, owner);
}

function passOwner(row, owner){
  if(owner === 'all') return true;
  if(owner === 'none') return !row.assigned_to;
  return row.assigned_to === owner;
}

function renderCandidates(q, owner){
  var rows = CANDIDATES.filter(function(c){
    if(!passOwner(c, owner)) return false;
    if(STALE_ONLY && (daysSince(c.stage_changed_at || c.created_at) || 0) < 14) return false;
    if(!q) return true;
    return [c.full_name, c.trade, prettyTrade(c.trade), c.title, c.city, c.email, c.phone]
      .join(' ').toLowerCase().indexOf(q) > -1;
  });

  var assessed = rows.filter(function(c){ return assessmentFor(c); }).length;
  var placed = rows.filter(function(c){ return c.stage === 'placed'; }).length;
  var submitted = rows.filter(function(c){ return c.stage === 'submitted'; }).length;
  document.getElementById('kpis').innerHTML =
    kpi(rows.length, 'In pipeline') +
    kpi(rows.filter(function(c){ return c.stage === 'applied'; }).length, 'New applications', 'Need screening') +
    kpi(assessed, 'Assessed', 'Skills verified') +
    kpi(submitted, 'Out to clients') +
    kpi(placed, 'Placed') +
    kpi(rows.filter(function(c){ return (daysSince(c.stage_changed_at||c.created_at)||0) >= 14 && c.stage !== 'placed'; }).length,
        'Stale', 'No movement 14+ days');

  var board = document.getElementById('board');
  board.style.gridTemplateColumns = 'repeat(' + CAND_STAGES.length + ', minmax(210px, 1fr))';
  board.innerHTML = CAND_STAGES.map(function(st){
    var items = rows.filter(function(c){ return (c.stage || 'applied') === st.id; });
    return '<div class="col">' +
      '<div class="col-h"><span class="col-t">' + st.label + '</span><span class="col-n">' + items.length + '</span></div>' +
      (items.length ? items.map(candCard).join('') : '<div class="col-empty">' + st.hint + '</div>') +
    '</div>';
  }).join('');
}

function candCard(c){
  var i = CANDIDATES.indexOf(c);
  var a = assessmentFor(c);
  var days = daysSince(c.stage_changed_at || c.created_at);
  var stale = days >= 14 && c.stage !== 'placed';
  var scorePill = '';
  if(a && a.score != null){
    var cls = a.score >= 75 ? 'g' : a.score >= 55 ? 'a' : 'r';
    scorePill = '<span class="pill ' + cls + '">' + a.score + ' ' + esc(a.verdict||'') + '</span>';
  }
  return '<div class="card" onclick="openCandidate(' + i + ')">' +
    '<div class="card-n">' + esc(c.full_name || 'Unnamed') + '</div>' +
    '<div class="card-s">' + esc(prettyTrade(c.title || c.trade)) + (c.city ? ' \u00b7 ' + esc(c.city) : '') + '</div>' +
    '<div class="card-m">' +
      scorePill +
      (c.availability ? '<span class="pill g">' + esc(c.availability) + '</span>' : '') +
      ((c.skills||[]).length ? '<span class="pill b">Card</span>' : '') +
      (c.recruiter_brief ? '<span class="pill">Profile</span>' : '') +
    '</div>' +
    '<div class="card-f">' +
      '<span>' + (ownerName(c.assigned_to) || 'Unassigned') + '</span>' +
      '<span class="' + (stale ? 'stale' : '') + '">' + (days != null ? days + 'd' : '') + '</span>' +
    '</div>' +
  '</div>';
}

function renderClients(q, owner){
  var rows = LEADS.filter(function(l){
    if(!passOwner(l, owner)) return false;
    if(STALE_ONLY && (daysSince(l.stage_changed_at || l.created_at) || 0) < 14) return false;
    if(!q) return true;
    return [l.company, l.location, (l.trades||[]).join(' '), l.contact_name]
      .join(' ').toLowerCase().indexOf(q) > -1;
  });

  var open = rows.filter(function(l){ return ['new','contacted','qualified','proposal'].indexOf(l.status) > -1; });
  var pipelineValue = open.reduce(function(sum, l){
    return sum + ((l.est_bill_rate||0) * 40 * (l.est_workers||0) * (l.est_weeks||0));
  }, 0);
  var wonValue = rows.filter(function(l){ return l.status === 'won'; }).reduce(function(sum, l){
    return sum + ((l.est_bill_rate||0) * 40 * (l.est_workers||0) * (l.est_weeks||0));
  }, 0);

  document.getElementById('kpis').innerHTML =
    kpi(rows.length, 'Opportunities') +
    kpi(open.length, 'Open', 'Not yet won or lost') +
    kpi(rows.filter(function(l){ return l.status === 'proposal'; }).length, 'Proposals out') +
    kpi(rows.filter(function(l){ return l.status === 'won'; }).length, 'Won') +
    kpi(pipelineValue ? money(pipelineValue) : '\u2014', 'Open pipeline', 'Estimated billings') +
    kpi(wonValue ? money(wonValue) : '\u2014', 'Won value');

  var board = document.getElementById('board');
  board.style.gridTemplateColumns = 'repeat(' + CLIENT_STAGES.length + ', minmax(200px, 1fr))';
  board.innerHTML = CLIENT_STAGES.map(function(st){
    var items = rows.filter(function(l){ return (l.status || 'new') === st.id; });
    return '<div class="col">' +
      '<div class="col-h"><span class="col-t">' + st.label + '</span><span class="col-n">' + items.length + '</span></div>' +
      (items.length ? items.map(leadCard).join('') : '<div class="col-empty">Nothing here</div>') +
    '</div>';
  }).join('');
}

function leadCard(l){
  var i = LEADS.indexOf(l);
  var days = daysSince(l.stage_changed_at || l.created_at);
  var stale = days >= 14 && ['won','lost','dead'].indexOf(l.status) === -1;
  var val = (l.est_bill_rate||0) * 40 * (l.est_workers||0) * (l.est_weeks||0);
  var fit = l.qlm_fit_score;
  return '<div class="card" onclick="openLead(' + i + ')">' +
    '<div class="card-n">' + esc(l.company || 'Unnamed') + '</div>' +
    '<div class="card-s">' + esc(l.location || '') + '</div>' +
    '<div class="card-m">' +
      (fit != null ? '<span class="pill ' + (fit >= 75 ? 'g' : fit >= 55 ? 'a' : '') + '">Fit ' + fit + '</span>' : '') +
      ((l.trades||[]).slice(0,2).map(function(t){ return '<span class="pill b">' + esc(prettyTrade(t)) + '</span>'; }).join('')) +
      (reportsFor(l.company).length ? '<span class="pill">Report</span>' : '') +
      (l.contact_name || l.contact_email || l.contact_phone ? '<span class="pill g">Contact</span>' : '') +
    '</div>' +
    '<div class="card-f">' +
      '<span>' + (val ? money(val) : (ownerName(l.assigned_to) || 'Unassigned')) + '</span>' +
      '<span class="' + (stale ? 'stale' : '') + '">' + (days != null ? days + 'd' : '') + '</span>' +
    '</div>' +
  '</div>';
}

function kpi(n, label, sub){
  return '<div class="kpi"><div class="n">' + n + '</div><div class="l">' + label + '</div>' +
    (sub ? '<div class="s">' + sub + '</div>' : '') + '</div>';
}

  var a = assessmentFor(c);
  document.getElementById('m-title').textContent = c.full_name || 'Candidate';
  document.getElementById('m-sub').textContent =
    [prettyTrade(c.title || c.trade), c.city, c.experience].filter(Boolean).join(' \u00b7 ');

  function row(k,v){ return v ? '<div class="mrow"><span class="k">'+k+'</span><span class="v">'+esc(v)+'</span></div>' : ''; }

  document.getElementById('m-body').innerHTML =
    '<div class="msec">Pipeline</div>' +
    '<div class="fl"><label>Stage</label><select id="f-stage">' +
      CAND_STAGES.map(function(s){ return '<option value="'+s.id+'"'+((c.stage||'applied')===s.id?' selected':'')+'>'+s.label+'</option>'; }).join('') +
      '<option value="inactive"' + (c.stage==='inactive'?' selected':'') + '>Inactive</option>' +
    '</select></div>' +
    '<div class="fl"><label>Owner</label><select id="f-owner"><option value="">Unassigned</option>' +
      TEAM.map(function(t){ return '<option value="'+t.id+'"'+(c.assigned_to===t.id?' selected':'')+'>'+esc(t.name)+'</option>'; }).join('') +
    '</select></div>' +

    '<div class="fl"><label>Follow up on</label><input type="date" id="f-date" value="'+(c.next_action_date||'')+'"></div>' +
    '<div class="fl"><label>Notes</label><textarea id="f-notes" placeholder="Internal notes">'+esc(c.crm_notes||'')+'</textarea></div>' +

    '<div class="msec">Contact</div>' +
    (c.phone ? '<div class="mrow"><span class="k">Phone</span><span class="v"><a href="tel:'+esc(c.phone)+'" style="color:#0077a8;">'+esc(c.phone)+'</a></span></div>' : '') +
    (c.email ? '<div class="mrow"><span class="k">Email</span><span class="v"><a href="mailto:'+esc(c.email)+'" style="color:#0077a8;">'+esc(c.email)+'</a></span></div>' : '') +
    (!c.phone && !c.email ? '<div style="font-size:.84rem;color:#94a3b8;">No contact details on file.</div>' : '') +

    (a ? '<div class="msec">Assessment</div>' +
      row('Trade tested', prettyTrade(a.trade)) + row('Score', (a.score!=null? a.score+' / 100':'')) +
      row('Verdict', a.verdict) + row('Integrity', a.integrity_flag) : '') +

    ((c.skills||[]).length ? '<div class="msec">Skills</div><div class="card-m">' +
      c.skills.map(function(s){ return '<span class="pill b">'+esc(s)+'</span>'; }).join('') + '</div>' : '') +

    (function(){
      var mine = SUBS.filter(function(s){ return s.candidate_id === c.id; });
      if(!mine.length) return '';
      return '<div class="msec">Submissions</div>' + mine.map(function(s){
        return '<div style="padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:.85rem;">' +
          '<strong style="color:#003a52;">' + esc(jobTitle(s.job_order_id)) + '</strong>' +
          ' <span class="pill ' + (SUB_COLOR[s.status]||'') + '">' + (SUB_LABEL[s.status]||s.status) + '</span></div>';
      }).join('');
    })() +

    activityBlock('candidate', c.id);

  var acts = [];
  acts.push('<button class="mbtn primary" onclick="saveCandidate('+i+')">Save</button>');
  if(c.recruiter_brief) acts.push('<a class="mbtn" href="/qlm-candidates.html" target="_blank">Profile report</a>');
  acts.push('<a class="mbtn" href="/qlm-candidates.html" target="_blank">Open in database</a>');
  if(!a) acts.push('<a class="mbtn" href="/qlm-trades-assessment.html" target="_blank">Send assessment</a>');
  acts.push('<button class="mbtn" onclick="closeModal()">Close</button>');
  document.getElementById('m-acts').innerHTML = acts.join('');
  document.getElementById('modal').classList.remove('hidden');
}

async function saveCandidate(i){
  var c = CANDIDATES[i];
  var patch = {
    stage: document.getElementById('f-stage').value,
    assigned_to: document.getElementById('f-owner').value || null,
    submitted_to: document.getElementById('f-submitted').value.trim() || null,
    next_action: document.getElementById('f-action').value.trim() || null,
    next_action_date: document.getElementById('f-date').value || null,
    crm_notes: document.getElementById('f-notes').value.trim() || null
  };
  var ok = await QLM.update('candidates', c.id, patch);
  if(ok){ Object.assign(c, patch); closeModal(); render(); }
  else alert('Could not save.');
}

// ═══════════ EXPORT ═══════════
function exportPipeline(){
  var rows, hdrs, name;
  if(TAB === 'jobs'){
    hdrs = ['Title','Company','City','Trade','Status','Priority','Openings','Placed','Pay','Bill','Start','Owner','Days'];
    rows = JOBS.map(function(j){
      return [j.title, companyName(j.company_id), j.city, prettyTrade(j.trade), j.status, j.priority,
              j.openings, subsFor(j.id).filter(function(s){return s.status==='placed';}).length,
              j.pay_rate, j.bill_rate, j.start_date, ownerName(j.owner_id),
              daysSince(j.stage_changed_at||j.created_at)];
    });
    name = 'qlm-job-orders';
  } else if(TAB === 'placements'){
    hdrs = ['Worker','Company','Job','Status','Start','End','Pay','Bill','Hrs/wk'];
    rows = PLACEMENTS.map(function(p){
      return [candName(p.candidate_id), companyName(p.company_id), jobTitle(p.job_order_id),
              p.status, p.start_date, p.end_date, p.pay_rate, p.bill_rate, p.hours_per_week];
    });
    name = 'qlm-placements';
  } else if(TAB === 'companies'){
    hdrs = ['Company','City','Status','Owner','Open Orders','Contacts'];
    rows = COMPANIES.map(function(co){
      return [co.name, co.city, co.status, ownerName(co.owner_id),
              jobsFor(co.id).filter(function(j){return ['open','filling'].indexOf(j.status)>-1;}).length,
              CONTACTS.filter(function(x){return x.company_id===co.id;}).length];
    });
    name = 'qlm-companies';
  } else if(TAB === 'candidates'){
    hdrs = ['Name','Trade','City','Phone','Email','Stage','Owner','Score','Verdict','Submitted To','Next Action','Follow Up','Days In Stage'];
    rows = CANDIDATES.map(function(c){
      var a = assessmentFor(c);
      return [c.full_name, prettyTrade(c.trade), c.city, c.phone, c.email, c.stage, ownerName(c.assigned_to),
              a&&a.score!=null?a.score:'', a?a.verdict:'', c.submitted_to, c.next_action, c.next_action_date,
              daysSince(c.stage_changed_at||c.created_at)];
    });
    name = 'qlm-candidate-pipeline';
  } else {
    hdrs = ['Company','Location','Trades','Stage','Owner','Fit','Workers','Bill Rate','Weeks','Est Value','Contact','Email','Phone','Next Action','Follow Up','Days In Stage'];
    rows = LEADS.map(function(l){
      var val = (l.est_bill_rate||0)*40*(l.est_workers||0)*(l.est_weeks||0);
      return [l.company, l.location, (l.trades||[]).join('; '), l.status, ownerName(l.assigned_to), l.qlm_fit_score,
              l.est_workers, l.est_bill_rate, l.est_weeks, val||'', l.contact_name, l.contact_email, l.contact_phone,
              l.next_action, l.next_action_date, daysSince(l.stage_changed_at||l.created_at)];
    });
    name = 'qlm-client-pipeline';
  }
  var csv = [hdrs.join(',')].concat(rows.map(function(r){
    return r.map(function(v){ return '"' + String(v==null?'':v).replace(/"/g,'""') + '"'; }).join(',');
  })).join('\n');
  var blob = new Blob([csv], {type:'text/csv'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = name + '-' + new Date().toISOString().split('T')[0] + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

window.addEventListener('DOMContentLoaded', function(){
  if(window.QLM) QLM.mountAuthBar('qlm-auth');
  setTimeout(loadAll, 500);
});
</script>
